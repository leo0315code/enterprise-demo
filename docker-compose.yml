version: '3.8'

services:
  # 应用程序服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-website-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - enterprise-website-network
    depends_on:
      - mysql
      - redis

  # Web 服务器
  nginx:
    image: nginx:alpine
    container_name: enterprise-website-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - enterprise-website-network
    depends_on:
      - app

  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: enterprise-website-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: enterprise_website
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - enterprise-website-network

  # Redis 缓存
  redis:
    image: redis:alpine
    container_name: enterprise-website-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - enterprise-website-network

networks:
  enterprise-website-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: